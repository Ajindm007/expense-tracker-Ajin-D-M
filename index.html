
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses easily</p>
        </header>


        <!-- Summary Section -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="total-expense">₹0.00</p>
            </div>

            <div class="summary-card">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
            </div>

        </section>


        <!-- Monthly Expense Summary -->
        <section class="monthly-summary">

            <h2>Monthly Expense Summary</h2>

            <div class="monthly-summary-content">

                <label for="month-select">Select Month</label>

                <input type="month" id="month-select">

                <p id="monthly-expense">₹0.00</p>

            </div>

        </section>


        <!-- Category-wise Expense Chart -->
        <section class="expense-chart">

            <h2>Category-wise Expenses</h2>

            <canvas id="expense-chart"></canvas>

        </section>


        <!-- Add Transaction Section -->
        <section class="transaction-form">

            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <p id="error-message"></p>


                <div class="form-group">
                    <label for="type">Transaction Type</label>

                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                    >
                </div>


                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category">

                        <option value="">Select Category</option>

                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="date">Date</label>

                    <input type="date" id="date">
                </div>


                <div class="form-group">
                    <label for="description">Description</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                    >
                </div>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Filter Section -->
        <section class="filters">

            <h2>Transactions</h2>

            <select id="filter-type">

                <option value="all">All Transactions</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>

            </select>


            <select id="filter-category">

                <option value="all">All Categories</option>

                <option value="Salary">Salary</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>

            </select>

        </section>


        <!-- Transaction List -->
        <section class="transaction-section">

            <div id="transaction-list">
                <!-- Transactions will be added here using JavaScript -->
            </div>

        </section>

    </div>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
